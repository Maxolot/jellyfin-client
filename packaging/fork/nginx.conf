server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
    add_header X-Content-Type-Options nosniff always;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.json { add_header Cache-Control "no-store"; }
    location = /fork-build.json { add_header Cache-Control "no-store"; }
    location = /serviceworker.js { add_header Cache-Control "no-cache"; }
    location = /offline-shell.json { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ =404; }
}
