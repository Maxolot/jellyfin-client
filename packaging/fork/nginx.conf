server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;
    # nginx drops server-level headers in any location that adds its own: each location repeats it.
    add_header X-Content-Type-Options nosniff always;
    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location = /config.json { add_header Cache-Control "no-store"; add_header X-Content-Type-Options nosniff always; }
    location = /fork-build.json { add_header Cache-Control "no-store"; add_header X-Content-Type-Options nosniff always; }
    location = /serviceworker.js { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location = /offline-shell.json { add_header Cache-Control "no-store"; add_header X-Content-Type-Options nosniff always; }
    # Content-hashed files never change under the same name.
    location ~* "\.[0-9a-f]{20}\.(chunk\.)?(js|css)$" { add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
    # Fixed names (main.jellyfin.bundle.js, node_modules.*.bundle.js…) change with every release:
    # without this the browser keeps them by heuristic and runs the previous version after a deployment.
    location ~* "\.(js|css)$" { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
    location / { try_files $uri $uri/ =404; }
}
