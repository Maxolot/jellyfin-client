<!DOCTYPE html><html><head><title>Movie Sources</title></head><body><div id="MovieSourcesConfig" data-role="page" class="page type-interior pluginConfigurationPage"><div data-role="content"><div class="content-primary"><h1>Movie Sources</h1><p>Recherche indicative des films dans Prowlarr. La disponibilité ne garantit pas le téléchargement.</p><form id="movieSourcesForm"><label><input type="checkbox" id="enabled"> Activer</label><p><label>Adresse Prowlarr <input id="address" type="url" required></label></p><p><label>Clé API Prowlarr <input id="credential" type="password" autocomplete="new-password" placeholder="Laisser vide pour conserver la clé actuelle"></label></p><button is="emby-button" type="submit" class="raised button-submit block">Enregistrer</button></form><p id="status" role="status"></p></div></div><script>
(function(){'use strict';var id='894c6e88-9250-4627-9d43-f45da80f30eb',page=document.querySelector('#MovieSourcesConfig');function el(id){return page.querySelector('#'+id)}page.addEventListener('pageshow',function(){ApiClient.getPluginConfiguration(id).then(function(c){el('enabled').checked=c.Enabled;el('address').value=c.Address;el('credential').value=''})});el('movieSourcesForm').addEventListener('submit',function(e){e.preventDefault();ApiClient.getPluginConfiguration(id).then(function(c){c.Enabled=el('enabled').checked;c.Address=el('address').value.trim();if(el('credential').value)c.ApiKey=el('credential').value;return ApiClient.updatePluginConfiguration(id,c)}).then(function(){el('credential').value='';el('status').textContent='Configuration enregistrée.'}).catch(function(){el('status').textContent='Enregistrement impossible.'})})})();
</script></div></body></html>
